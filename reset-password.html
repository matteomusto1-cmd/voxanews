<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reimposta password — VoxaNews</title>
<meta name="robots" content="noindex, nofollow">

<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tailwind-config.js"></script>
<link rel="stylesheet" href="assets/style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="antialiased">

<header id="site-header" class="sticky top-0 z-50 bg-paper/95 border-b border-hairline">
  <div id="header-placeholder"></div>
</header>

<main>
  <section class="max-w-md mx-auto px-6 py-16 lg:py-20">
    <h1 class="font-serif text-3xl font-bold text-ink mb-2 text-center">Reimposta la password</h1>
    <p class="text-sm text-ink/60 text-center mb-10">Scegli una nuova password per il tuo account.</p>

    <form id="reset-form" class="flex flex-col gap-5" novalidate>
      <div>
        <label for="new-password" class="block text-xs font-semibold uppercase tracking-widest text-ink/50 mb-2">Nuova password</label>
        <input id="new-password" type="password" autocomplete="new-password" required minlength="6"
               class="w-full border border-hairline bg-white px-4 py-3 text-sm rounded-sm focus:outline-none focus:border-accent transition-colors duration-300">
        <p class="text-xs text-ink/40 mt-1">Almeno 6 caratteri.</p>
      </div>
      <div>
        <label for="confirm-password" class="block text-xs font-semibold uppercase tracking-widest text-ink/50 mb-2">Conferma password</label>
        <input id="confirm-password" type="password" autocomplete="new-password" required minlength="6"
               class="w-full border border-hairline bg-white px-4 py-3 text-sm rounded-sm focus:outline-none focus:border-accent transition-colors duration-300">
      </div>
      <p id="reset-error" class="text-sm text-accent hidden"></p>
      <p id="reset-success" class="text-sm text-accent hidden"></p>
      <button type="submit" class="bg-ink text-white text-sm font-semibold px-6 py-3 rounded-sm hover:bg-accent transition-colors duration-300">
        Salva nuova password
      </button>
    </form>
  </section>
</main>

<footer class="border-t border-hairline bg-paper">
  <div id="footer-placeholder"></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js"></script>
<script src="assets/site.js"></script>
<script>
  initLayout(null);

  document.getElementById('reset-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw1 = document.getElementById('new-password').value;
    const pw2 = document.getElementById('confirm-password').value;
    const errorEl = document.getElementById('reset-error');
    const successEl = document.getElementById('reset-success');
    errorEl.classList.add('hidden');
    successEl.classList.add('hidden');

    if (pw1 !== pw2) {
      errorEl.textContent = 'Le due password non coincidono.';
      errorEl.classList.remove('hidden');
      return;
    }

    const { error } = await sb.auth.updateUser({ password: pw1 });

    if (error) {
      errorEl.textContent = error.message === 'Auth session missing!'
        ? 'Il link non è più valido o è scaduto. Richiedi un nuovo link dalla pagina di accesso.'
        : error.message;
      errorEl.classList.remove('hidden');
      return;
    }

    successEl.textContent = 'Password aggiornata! Tra un attimo ti portiamo alla pagina di accesso.';
    successEl.classList.remove('hidden');
    document.getElementById('reset-form').reset();
    setTimeout(() => { window.location.href = 'login.html'; }, 2200);
  });
</script>

</body>
</html>
